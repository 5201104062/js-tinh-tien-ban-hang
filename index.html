<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tính tiền bán hàng</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Tiêu đề chỉ hiện trên bản in -->
  <div class="chi-khi-in">
    <h1>HÓA ĐƠN BÁN HÀNG</h1>
    <p id="ngay-in"></p>
  </div>

  <h1 class="chi-tren-man-hinh">Tính tiền bán hàng</h1>

  <div class="vung-bang">
    <table id="bang-hang">
      <thead>
        <tr>
          <th>STT</th>
          <th>Tên hàng hóa</th>
          <th>Số lượng có</th>
          <th>Số lượng mua</th>
          <th>Đơn giá</th>
          <th>Chọn mua</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>CPU</td>
          <td><input type="text" class="so-luong-co" value="14" readonly></td>
          <td><input type="text" class="so-luong-mua" value="0" inputmode="numeric" disabled></td>
          <td><input type="text" class="don-gia" value="120 $" readonly></td>
          <td><input type="checkbox" class="chon-mua" aria-label="Chọn mua CPU"></td>
        </tr>
        <tr>
          <td>2</td>
          <td>HDD</td>
          <td><input type="text" class="so-luong-co" value="14" readonly></td>
          <td><input type="text" class="so-luong-mua" value="0" inputmode="numeric" disabled></td>
          <td><input type="text" class="don-gia" value="10 $" readonly></td>
          <td><input type="checkbox" class="chon-mua" aria-label="Chọn mua HDD"></td>
        </tr>
        <tr>
          <td>3</td>
          <td>RAM</td>
          <td><input type="text" class="so-luong-co" value="12" readonly></td>
          <td><input type="text" class="so-luong-mua" value="0" inputmode="numeric" disabled></td>
          <td><input type="text" class="don-gia" value="29 $" readonly></td>
          <td><input type="checkbox" class="chon-mua" aria-label="Chọn mua RAM"></td>
        </tr>
        <tr>
          <td>4</td>
          <td>ROM</td>
          <td><input type="text" class="so-luong-co" value="23" readonly></td>
          <td><input type="text" class="so-luong-mua" value="0" inputmode="numeric" disabled></td>
          <td><input type="text" class="don-gia" value="130 $" readonly></td>
          <td><input type="checkbox" class="chon-mua" aria-label="Chọn mua ROM"></td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td colspan="2"></td>
          <td>
            <button type="button" id="nut-ok">OK</button>
            <button type="button" id="nut-nhap-lai">Nhập lại</button>
          </td>
          <td colspan="2">
            <label for="tong-cong">Tổng cộng:</label>
            <input type="text" id="tong-cong" value="0" readonly>
          </td>
          <td><label><input type="checkbox" id="vat"> VAT</label></td>
        </tr>
      </tfoot>
    </table>
  </div>

  <p id="thong-bao"></p>

  <div class="chi-tren-man-hinh nut-in">
    <button type="button" id="nut-in">In hóa đơn</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
